<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teamlos</title>
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Teamlos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #f6f5f1;
    --fg: #1d2321;
    --muted: #6b726f;
    --card: #ffffff;
    --line: #e2e0d8;
    --accent: #2f6f5e;
    --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a;
      --fg: #ecece8;
      --muted: #9aa09c;
      --card: #202325;
      --line: #2f3336;
      --accent: #5fb399;
      --accent-fg: #0f1a16;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }
  .screen {
    display: none;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 520px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);
  }
  .screen.active { display: flex; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn {
    border: 0;
    border-radius: 14px;
    padding: 15px 20px;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-fg);
    width: 100%;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.6; }
  .btn.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    font-weight: 500;
  }

  /* Start */
  #start { align-items: center; justify-content: center; text-align: center; gap: 8px; }
  #start h1 { font-size: 44px; letter-spacing: -1px; margin: 12px 0 0; }
  #start p { color: var(--muted); margin: 0 0 20px; }
  #deco { width: 220px; height: 220px; }
  #deco .spin { transform-origin: 110px 110px; animation: spin 28s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #start .btn { max-width: 320px; margin-top: 12px; }

  /* Spiel */
  .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .top h2 { margin: 0; font-size: 22px; letter-spacing: -0.5px; }
  .top span { color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 8px; }
  .row input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 16px;
    padding: 13px 14px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--fg);
    outline: none;
  }
  .row input:focus { border-color: var(--accent); }
  .icon-btn {
    width: 48px;
    flex: none;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--card);
    display: grid;
    place-items: center;
  }
  .icon-btn svg { width: 22px; height: 22px; stroke: var(--fg); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn.rec { background: #d6453d; border-color: #d6453d; }
  .icon-btn.rec svg { stroke: #fff; }
  #status { min-height: 22px; margin: 8px 2px 0; font-size: 14px; color: var(--muted); }

  #arena {
    position: relative;
    margin-top: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    height: 340px;
    overflow: hidden;
  }
  #arena.showing-results { height: auto; min-height: 120px; overflow: visible; }
  #swirl { position: absolute; inset: 0; }
  .chip {
    position: absolute;
    left: 0;
    top: 0;
    padding: 6px 13px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--line);
    font-size: 15px;
    white-space: nowrap;
    will-change: transform;
  }
  #empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 30px;
    color: var(--muted);
  }
  #empty[hidden], #swirl[hidden], #results[hidden] { display: none; }
  #results { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .team {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--bg);
  }
  .team .label { flex: none; width: 64px; font-size: 13px; font-weight: 600; color: var(--accent); padding-top: 2px; }
  .team .members { display: flex; flex-direction: column; gap: 2px; font-size: 18px; font-weight: 500; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 14px 0 10px; padding: 4px; background: var(--line); border-radius: 14px; }
  .seg button { border: 0; background: transparent; padding: 11px; border-radius: 11px; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  details { margin-top: 14px; color: var(--muted); font-size: 14px; }
  summary { cursor: pointer; padding: 4px 2px; }
  #list { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 8px; }
  .tag { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 14px; }

  .spacer { flex: 1; min-height: 24px; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translateX(-50%) translateY(20px);
    background: var(--fg);
    color: var(--bg);
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    max-width: 90%;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- Startmenü -->
<main id="start" class="screen">
  <svg id="deco" viewBox="0 0 220 220" aria-hidden="true"></svg>
  <h1>Teamlos</h1>
  <p>Teams auslosen. Schnell.</p>
  <button class="btn" id="newNight" type="button">Neuer Spieleabend</button>
</main>

<!-- Spieleabend -->
<main id="game" class="screen">
  <div class="top">
    <h2>Teamlos</h2>
    <span id="count">0 Namen</span>
  </div>

  <div class="row">
    <input id="nameInput" type="text" placeholder="Name eingeben" autocomplete="off" autocapitalize="words" enterkeyhint="done" aria-label="Name eingeben">
    <button class="icon-btn" id="addBtn" type="button" aria-label="Name hinzufügen">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="icon-btn" id="micBtn" type="button" aria-label="Namen einsprechen">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </div>
  <div id="status" aria-live="polite"></div>

  <div id="arena">
    <div id="swirl"></div>
    <div id="empty">Noch keine Namen.<br>Tippe sie ein oder sprich sie mit dem Mikrofon ein.</div>
    <div id="results" hidden></div>
  </div>

  <div class="seg" role="group" aria-label="Teamgröße">
    <button type="button" data-size="2" aria-pressed="true">Zweierteams</button>
    <button type="button" data-size="3" aria-pressed="false">Dreierteams</button>
  </div>
  <button class="btn" id="shuffleBtn" type="button">Mischen</button>

  <details>
    <summary>Namen verwalten</summary>
    <div id="list"></div>
  </details>

  <div class="spacer"></div>
  <button class="btn ghost" id="endBtn" type="button">Spieleabend beenden</button>
</main>

<div id="toast" role="status"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const KEY = 'teamlos:v1';

  // ---------- Speicher ----------
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.names)) {
        return { active: !!s.active, names: s.names.map(String), size: s.size === 3 ? 3 : 2 };
      }
    } catch (e) {}
    return { active: false, names: [], size: 2 };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  let state = load();

  // ---------- Elemente ----------
  const arena = $('#arena'), swirl = $('#swirl'), emptyEl = $('#empty'), results = $('#results');
  const countEl = $('#count'), listEl = $('#list'), input = $('#nameInput');
  const statusEl = $('#status'), micBtn = $('#micBtn'), shuffleBtn = $('#shuffleBtn');

  // ---------- Hinweis (Toast) ----------
  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  // ---------- Deko-Glücksrad ----------
  (function buildDeco() {
    const svg = $('#deco');
    const NS = 'http://www.w3.org/2000/svg';
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'spin');
    const n = 8, R = 96, cx = 110, cy = 110;
    for (let i = 0; i < n; i++) {
      const a0 = (i / n) * 2 * Math.PI, a1 = ((i + 1) / n) * 2 * Math.PI;
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', `M${cx} ${cy} L${cx + R * Math.cos(a0)} ${cy + R * Math.sin(a0)} A${R} ${R} 0 0 1 ${cx + R * Math.cos(a1)} ${cy + R * Math.sin(a1)} Z`);
      p.setAttribute('fill', i % 2 ? 'var(--card)' : 'var(--accent)');
      p.setAttribute('stroke', 'var(--line)');
      p.setAttribute('stroke-width', '1');
      g.appendChild(p);
    }
    svg.appendChild(g);
    const ring = document.createElementNS(NS, 'circle');
    ring.setAttribute('cx', cx); ring.setAttribute('cy', cy); ring.setAttribute('r', R);
    ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', 'var(--fg)'); ring.setAttribute('stroke-width', '3');
    svg.appendChild(ring);
    const hub = document.createElementNS(NS, 'circle');
    hub.setAttribute('cx', cx); hub.setAttribute('cy', cy); hub.setAttribute('r', 9);
    hub.setAttribute('fill', 'var(--fg)');
    svg.appendChild(hub);
    const ptr = document.createElementNS(NS, 'path');
    ptr.setAttribute('d', 'M110 22 L100 2 L120 2 Z');
    ptr.setAttribute('fill', 'var(--fg)');
    svg.appendChild(ptr);
  })();

  // ---------- Strudel ----------
  let chipsArr = [];
  let loopOn = false, rafId = 0, lastT = 0;
  let spinTarget = 0, spin = 0;

  function buildChips() {
    swirl.innerHTML = '';
    chipsArr = state.names.map((name, i) => {
      const el = document.createElement('div');
      el.className = 'chip';
      el.textContent = name;
      swirl.appendChild(el);
      const rad = 0.3 + 0.7 * ((i * 0.618034) % 1);
      return { el, ang: i * 2.4, rad, speed: 0.0004 + 0.0013 * (1 - rad), phase: i * 1.7 };
    });
  }

  function tick(t) {
    if (!loopOn) return;
    const dt = Math.min(48, t - (lastT || t));
    lastT = t;
    spin += (spinTarget - spin) * 0.08;
    const w = arena.clientWidth, h = arena.clientHeight;
    const cx = w / 2, cy = h / 2, rx = w * 0.34, ry = h * 0.38;
    const mult = 1 + spin * 8;
    for (const c of chipsArr) {
      c.ang += dt * c.speed * mult;
      const r = (c.rad + 0.06 * Math.sin(t / 900 + c.phase)) * (1 - 0.35 * spin);
      const x = cx + Math.cos(c.ang) * rx * r;
      const y = cy + Math.sin(c.ang) * ry * r;
      c.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${0.85 + 0.3 * r})`;
    }
    rafId = requestAnimationFrame(tick);
  }
  function startLoop() {
    if (loopOn) return;
    loopOn = true; lastT = 0;
    rafId = requestAnimationFrame(tick);
  }
  function stopLoop() {
    loopOn = false;
    cancelAnimationFrame(rafId);
  }

  // ---------- Ansichten ----------
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    if (id === 'game') { render(); showSwirl(); } else { stopLoop(); }
    window.scrollTo(0, 0);
  }

  function showSwirl() {
    results.hidden = true;
    swirl.hidden = false;
    arena.classList.remove('showing-results');
    emptyEl.hidden = state.names.length > 0;
    shuffleBtn.textContent = 'Mischen';
    startLoop();
  }

  function showResults(teams) {
    stopLoop();
    swirl.hidden = true;
    emptyEl.hidden = true;
    results.hidden = false;
    arena.classList.add('showing-results');
    results.innerHTML = '';
    teams.forEach((members, i) => {
      const card = document.createElement('div');
      card.className = 'team';
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = 'Team ' + (i + 1);
      const list = document.createElement('div');
      list.className = 'members';
      members.forEach(m => {
        const d = document.createElement('div');
        d.textContent = m;
        list.appendChild(d);
      });
      card.append(label, list);
      results.appendChild(card);
    });
    shuffleBtn.textContent = 'Nochmal mischen';
  }

  function render() {
    buildChips();
    const n = state.names.length;
    countEl.textContent = n + (n === 1 ? ' Name' : ' Namen');
    emptyEl.hidden = n > 0;
    listEl.innerHTML = '';
    state.names.forEach((name, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tag';
      b.textContent = name + ' \u00d7';
      b.setAttribute('aria-label', name + ' entfernen');
      b.addEventListener('click', () => {
        state.names.splice(i, 1);
        save();
        render();
        showSwirl();
      });
      listEl.appendChild(b);
    });
    document.querySelectorAll('.seg button').forEach(b => {
      b.setAttribute('aria-pressed', String(Number(b.dataset.size) === state.size));
    });
  }

  // ---------- Namen hinzufügen ----------
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function addNames(list) {
    const clean = list.map(s => s.trim()).filter(Boolean).map(cap);
    if (!clean.length) return 0;
    state.names.push(...clean);
    save();
    render();
    showSwirl();
    return clean.length;
  }

  function addTyped() {
    const parts = input.value.split(/[,;\n]+|\s+und\s+/i);
    if (addNames(parts)) input.value = '';
    input.focus();
  }
  $('#addBtn').addEventListener('click', addTyped);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTyped(); } });

  // ---------- Spracheingabe ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, heard = '';

  function parseSpoken(text) {
    return text
      .replace(/[.,;:!?]/g, ' ')
      .split(/\s+/)
      .filter(w => w && w.toLowerCase() !== 'und');
  }

  function setListening(on) {
    listening = on;
    micBtn.classList.toggle('rec', on);
    micBtn.setAttribute('aria-label', on ? 'Aufnahme beenden' : 'Namen einsprechen');
    if (on) statusEl.textContent = 'Ich höre zu \u2026 Sag alle Namen, dann tippe wieder aufs Mikrofon.';
  }

  micBtn.addEventListener('click', () => {
    if (!SR) { toast('Spracheingabe wird hier nicht unterstützt. Bitte tippen.'); return; }
    if (listening) { try { rec.stop(); } catch (e) {} return; }
    heard = '';
    rec = new SR();
    rec.lang = 'de-DE';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = e => {
      let all = '';
      for (let k = 0; k < e.results.length; k++) all += e.results[k][0].transcript + ' ';
      heard = all.trim();
      statusEl.textContent = heard ? '\u201e' + heard + '\u201c' : 'Ich höre zu \u2026';
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('Mikrofon ist nicht erlaubt.');
      else if (e.error !== 'no-speech' && e.error !== 'aborted') toast('Spracheingabe hat nicht geklappt.');
    };
    rec.onend = () => {
      setListening(false);
      const names = parseSpoken(heard);
      const n = addNames(names);
      statusEl.textContent = n ? n + (n === 1 ? ' Name hinzugefügt.' : ' Namen hinzugefügt.') : '';
      heard = '';
    };
    try { rec.start(); setListening(true); } catch (e) { toast('Spracheingabe konnte nicht starten.'); }
  });

  // ---------- Teams ----------
  function rnd(n) {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] % n;
  }
  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = rnd(i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function makeTeams(names, k) {
    const p = shuffled(names);
    const n = p.length;
    const t = Math.floor(n / k);
    const r = n - t * k;
    let sizes;
    if (t === 0) sizes = [n];
    else {
      sizes = Array(t).fill(k);
      if (r > 0) {
        if (k === 2 || r === 1) sizes[t - 1] += r; // letztes Team bekommt eine Person mehr
        else sizes.push(r);                          // bei Dreierteams: Rest von 2 wird ein Zweierteam
      }
    }
    const teams = [];
    let idx = 0;
    for (const s of sizes) { teams.push(p.slice(idx, idx + s)); idx += s; }
    return teams;
  }

  document.querySelectorAll('.seg button').forEach(b => {
    b.addEventListener('click', () => {
      state.size = Number(b.dataset.size);
      save();
      render();
      showSwirl();
    });
  });

  let busy = false;
  shuffleBtn.addEventListener('click', async () => {
    if (busy) return;
    if (state.names.length < 2) { toast('Mindestens 2 Namen eingeben.'); return; }
    busy = true;
    shuffleBtn.disabled = true;
    showSwirl();
    spinTarget = 1;
    await new Promise(r => setTimeout(r, 1500));
    spinTarget = 0;
    showResults(makeTeams(state.names, state.size));
    spin = 0;
    busy = false;
    shuffleBtn.disabled = false;
  });

  // ---------- Start / Ende ----------
  $('#newNight').addEventListener('click', () => {
    state = { active: true, names: [], size: state.size };
    save();
    showScreen('game');
  });

  $('#endBtn').addEventListener('click', () => {
    if (!confirm('Spieleabend beenden? Alle Namen werden gelöscht.')) return;
    state = { active: false, names: [], size: state.size };
    save();
    statusEl.textContent = '';
    showScreen('start');
  });

  // ---------- Start ----------
  showScreen(state.active ? 'game' : 'start');

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
